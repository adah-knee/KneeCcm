<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Music</title>
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #181818;
      --bg-hover: #282828;
      --spotify-green: #1DB954;
      --text-primary: #FFFFFF;
      --text-secondary: #B3B3B3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 16px 20px 12px;
      background: linear-gradient(180deg, #222222 0%, var(--bg-main) 100%);
      border-bottom: 1px solid #282828;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-group { display: flex; align-items: baseline; gap: 8px; }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    #song-count { font-size: 13px; color: var(--text-secondary); }

    .btn-add {
      background-color: var(--spotify-green);
      color: #000000;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 20px;
      text-decoration: none;
    }
    .btn-add:active { transform: scale(0.95); opacity: 0.9; }
    
    #search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background-color: #2A2A2A;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    #search-input::placeholder { color: var(--text-secondary); }

    #playlist {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 24px;
    }
    .song-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .song-item:active { background-color: var(--bg-hover); }
    .song-index {
      width: 28px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-right: 12px;
    }
    .song-info { flex: 1; overflow: hidden; }
    .song-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item.active .song-title,
    .song-item.active .song-index {
      color: var(--spotify-green);
      font-weight: 700;
    }

    .player-bar {
      background-color: var(--bg-card);
      border-top: 1px solid #282828;
      padding: 14px 20px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .now-playing {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    #seek-bar {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: #4D4D4D;
      border-radius: 2px;
      outline: none;
    }
    #seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-primary);
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 16px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:active { transform: scale(0.92); }
    .btn-main { color: var(--text-primary); font-size: 24px; }
    .btn-play {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--text-primary);
      color: #000000;
      font-size: 22px;
    }
    .btn-repeat.active { color: var(--spotify-green); position: relative; }
    .btn-repeat.active::after {
      content: "1";
      position: absolute;
      font-size: 9px;
      font-weight: 800;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -45%);
    }

    .loading { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>My Playlist</h1>
        <span id="song-count">로딩 중...</span>
      </div>
      <a class="btn-add" id="btn-github-upload" target="_blank">+ 곡 관리</a>
    </div>
    <input type="text" id="search-input" placeholder="곡 제목 검색...">
  </header>

  <div id="playlist">
    <div class="loading">음악 목록을 불러오는 중입니다...</div>
  </div>

  <div class="player-bar">
    <div class="now-playing" id="current-title">재생할 곡을 선택하세요</div>
    
    <div class="progress-container">
      <span id="current-time">0:00</span>
      <input type="range" id="seek-bar" value="0" min="0" max="100">
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-shuffle" title="랜덤 재생">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>

      <button class="ctrl-btn btn-main" id="btn-prev" title="이전 곡">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
      </button>

      <button class="ctrl-btn btn-play" id="btn-play" title="재생/일시정지">▶</button>

      <button class="ctrl-btn btn-main" id="btn-next" title="다음 곡">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
      </button>

      <button class="ctrl-btn btn-repeat" id="btn-repeat" title="한 곡 반복">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
      </button>
    </div>
  </div>

  <audio id="audio-player" preload="metadata" playsinline></audio>

  <script>
    const GITHUB_USER = "adah-knee";
    const GITHUB_REPO = "KneeCcm";
    const FOLDER_PATH = "songs";
    const audio = document.getElementById("audio-player");
    const playlistEl = document.getElementById("playlist");
    const songCountEl = document.getElementById("song-count");
    const searchInput = document.getElementById("search-input");
    const currentTitleEl = document.getElementById("current-title");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnRepeat = document.getElementById("btn-repeat");
    const btnShuffle = document.getElementById("btn-shuffle");
    const seekBar = document.getElementById("seek-bar");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const btnGithubUpload = document.getElementById("btn-github-upload");

    btnGithubUpload.href = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/tree/main/${FOLDER_PATH}`;

    let songs = [];
    let filteredSongs = [];
    let currentIndex = -1;
    let isRepeatOne = false;
    let isShuffle = false;

    async function fetchSongs() {
      try {
        const apiUrl = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("저장소 정보를 불러올 수 없습니다.");
        
        const files = await res.json();
        songs = files
          .filter(f => f.name.toLowerCase().endsWith(".mp3"))
          .map(f => ({
            name: f.name.replace(/\.mp3$/i, ""),
            url: `https://githubusercontent.com{GITHUB_USER}/${GITHUB_REPO}/main/${FOLDER_PATH}/${encodeURIComponent(f.name)}`
          }))
          .sort((a, b) => a.name.localeCompare(b.name));

        filteredSongs = [...songs];
        songCountEl.textContent = `총 ${songs.length}곡`;
        renderPlaylist(filteredSongs);
      } catch (err) {
        playlistEl.innerHTML = `<div class="loading">목록을 불러오지 못했습니다.<br>GitHub 아이디와 Public 설정을 확인해 주세요.</div>`;
      }
    }

    function renderPlaylist(list) {
      playlistEl.innerHTML = "";
      list.forEach((song, idx) => {
        const originalIndex = songs.findIndex(s => s.url === song.url);
        const div = document.createElement("div");
        div.className = `song-item ${originalIndex === currentIndex ? "active" : ""}`;
        div.innerHTML = `
          <div class="song-index">${originalIndex === currentIndex ? "▶" : idx + 1}</div>
          <div class="song-info">
            <div class="song-title">${song.name}</div>
          </div>
        `;
        div.onclick = () => playSong(originalIndex);
        playlistEl.appendChild(div);
      });
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[currentIndex];
      
      audio.src = song.url;
      audio.play();
      
      currentTitleEl.textContent = song.name;
      btnPlay.textContent = "❚❚";
      renderPlaylist(filteredSongs);
    }

    btnPlay.onclick = () => {
      if (currentIndex === -1 && songs.length > 0) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        btnPlay.textContent = "❚❚";
      } else {
        audio.pause();
        btnPlay.textContent = "▶";
      }
    };

    btnPrev.onclick = () => {
      if (songs.length === 0) return;
      let prev = currentIndex - 1;
      if (prev < 0) prev = songs.length - 1;
      playSong(prev);
    };

    btnNext.onclick = () => {
      if (songs.length === 0) return;
      if (isShuffle) {
        const rand = Math.floor(Math.random() * songs.length);
        playSong(rand);
      } else {
        let next = (currentIndex + 1) % songs.length;
        playSong(next);
      }
    };

    btnRepeat.onclick = () => {
      isRepeatOne = !isRepeatOne;
      btnRepeat.classList.toggle("active", isRepeatOne);
    };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.style.color = isShuffle ? "var(--spotify-green)" : "var(--text-secondary)";
    };

    audio.onended = () => {
      if (isRepeatOne) {
        audio.currentTime = 0;
        audio.play();
      } else {
        btnNext.click();
      }
    };

    audio.ontimeupdate = () => {
      if (!audio.duration || isNaN(audio.duration)) return;
      seekBar.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationEl.textContent = formatTime(audio.duration);
    };

    seekBar.oninput = () => {
      if (!audio.duration || isNaN(audio.duration)) return;
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    };

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    searchInput.oninput = (e) => {
      const keyword = e.target.value.toLowerCase();
      filteredSongs = songs.filter(s => s.name.toLowerCase().includes(keyword));
      renderPlaylist(filteredSongs);
    };

    fetchSongs();
  </script>
</body>
</html>
